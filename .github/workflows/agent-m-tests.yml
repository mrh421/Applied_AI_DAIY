    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      AGENT_M_TOKEN: ${{ secrets.AGENT_M_TOKEN }}
      AGENT_M_EXPECTED: ''
      AGENT_M_INSTANCE_COMMIT: 'd56dceec28fe26058ac8a336c5cd30e23794b234'
    steps:
      - uses: actions/checkout@v4
