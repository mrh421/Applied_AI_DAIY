  user-on-demand:
    name: user-on-demand
    if: github.event_name == 'workflow_dispatch' && contains(format(',{0},', inputs.rows), ',user,')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    env:
      AGENT_M_ROW: user
      AGENT_M_OCCASION: on-demand
      AGENT_M_SHARD: ${{ matrix.shard }}
      AGENT_M_SHARDS: '1'
      AGENT_M_COMMAND: 'node prototype/scripts/agent-m-tests.mjs'
      AGENT_M_SECRETS: ''
      AGENT_M_INSTANCE_COMMIT: 'd56dceec28fe26058ac8a336c5cd30e23794b234'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: mrh421/agent-m
          ref: d56dceec28fe26058ac8a336c5cd30e23794b234
          path: .agent-m
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up the tests
        run: |
          npm install -g bun && cd prototype && bun install --frozen-lockfile && node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Run the tests of the row user
        run: node .agent-m/src/workflow-entries/main.mjs runTests
      - name: Keep the report and the status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: on-demand.user.${{ matrix.shard }}
          path: agent-m-reports/
          if-no-files-found: ignore
          retention-days: 1
  agent-m-records:
    name: agent-m records
    needs: [unit-nightly, unit-release-candidate, unit-on-demand, component-nightly, component-release-candidate, component-on-demand, system-nightly, system-release-candidate, system-on-demand, paid-nightly, paid-release-candidate, paid-on-demand, release-release-candidate, release-on-demand, user-release-candidate, user-on-demand]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      AGENT_M_TOKEN: ${{ secrets.AGENT_M_TOKEN }}
      AGENT_M_INSTANCE_COMMIT: 'd56dceec28fe26058ac8a336c5cd30e23794b234'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: mrh421/agent-m
          ref: d56dceec28fe26058ac8a336c5cd30e23794b234
          path: .agent-m
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Take the reports of the run
        uses: actions/download-artifact@v4
        with:
          path: agent-m-reports
          merge-multiple: true
      - name: Add the run's result record
        run: node .agent-m/src/workflow-entries/main.mjs onTestsFinished
      - name: Keep the status
        if: always()
