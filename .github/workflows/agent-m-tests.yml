# Generated by Agent M from docs/tests/schedule.md. Change the schedule, not this file.
name: agent-m tests

on:
  push:
    branches: ["**"]
    tags:
      - "v*-rc.*"
    paths-ignore:
      - docs/jobs/**
      - docs/conversations/**
  pull_request:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      rows:
        description: "The rows to run, separated by commas"
        required: true

permissions:
  contents: read

jobs:
  unit-nightly:
    name: unit-nightly
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    env:
      AGENT_M_ROW: unit
      AGENT_M_OCCASION: nightly
      AGENT_M_SHARD: ${{ matrix.shard }}
      AGENT_M_SHARDS: '1'
      AGENT_M_COMMAND: 'node prototype/scripts/agent-m-tests.mjs'
      AGENT_M_SECRETS: ''
      AGENT_M_INSTANCE_COMMIT: 'd56dceec28fe26058ac8a336c5cd30e23794b234'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: mrh421/agent-m
          ref: d56dceec28fe26058ac8a336c5cd30e23794b234
          path: .agent-m
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up the tests
        run: |
          npm install -g bun && cd prototype && bun install --frozen-lockfile && node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Run the tests of the row unit
        run: node .agent-m/src/workflow-entries/main.mjs runTests
      - name: Keep the report and the status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly.unit.${{ matrix.shard }}
          path: agent-m-reports/
          if-no-files-found: ignore
          retention-days: 1
  unit-release-candidate:
    name: unit-release-candidate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
